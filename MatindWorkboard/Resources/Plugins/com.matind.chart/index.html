<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #fff; padding: 16px; }
  .title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .bar { flex: 1; background: #007AFF; border-radius: 4px 4px 0 0; opacity: 0.8; transition: height 0.3s; }
  .labels { display: flex; gap: 8px; margin-top: 6px; }
  .label { flex: 1; text-align: center; font-size: 10px; color: #999; }
</style>
</head>
<body>
<div class="title">月度数据</div>
<div class="chart" id="chart"></div>
<div class="labels" id="labels"></div>
<script>
  const data = [65, 80, 45, 92, 70, 55, 88];
  const months = ['1月','2月','3月','4月','5月','6月','7月'];
  const max = Math.max(...data);
  const chart = document.getElementById('chart');
  const labels = document.getElementById('labels');
  data.forEach((v, i) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (v / max * 100) + '%';
    bar.title = months[i] + ': ' + v;
    chart.appendChild(bar);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = months[i];
    labels.appendChild(label);
  });
  // 测试 MatindBridge（如果存在）
  if (window.MatindBridge) {
    console.log('[Chart] MatindBridge available');
  }
</script>
</body>
</html>
