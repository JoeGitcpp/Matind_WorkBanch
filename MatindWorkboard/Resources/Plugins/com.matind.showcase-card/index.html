<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .label { font-size: 10px; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; }
  .value { font-size: 32px; font-weight: 700; margin: 4px 0; }
  .desc { font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="label">活跃工作板</div>
  <div class="value">12</div>
  <div class="desc">本月新增 3 个</div>
</body>
</html>
