name: MatindWorkboard
options:
  bundleIdPrefix: com.matrixindustry
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  MatindCore:
    path: MatindCore

configs:
  Local: debug
  Remote: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MatindWorkboard:
    type: application
    platform: macOS
    sources:
      - path: MatindWorkboard
        excludes:
          - Resources/**
          - Config/**
    configFiles:
      Local: MatindWorkboard/Config/Local.xcconfig
      Remote: MatindWorkboard/Config/Remote.xcconfig
      Release: MatindWorkboard/Config/Remote.xcconfig
    dependencies:
      - package: MatindCore
    resources:
      - path: MatindWorkboard/Resources/Plugins
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matrixindustry.matind-workboard
        PRODUCT_NAME: MatindWorkboard
        INFOPLIST_FILE: MatindWorkboard/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: MatindWorkboard/MatindWorkboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # 沙盒监听所需。进程只绑 127.0.0.1，不对外网卡开放。
        com.apple.security.network.server: true

  MatindWorkboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MatindWorkboardTests
    dependencies:
      - target: MatindWorkboard
      - package: MatindCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matrixindustry.matind-workboard-tests

schemes:
  MatindWorkboard:
    build:
      targets:
        MatindWorkboard: all
        MatindWorkboardTests: [test]
    run:
      config: Local
    test:
      config: Local
      targets:
        - MatindWorkboardTests
  MatindWorkboard Remote:
    build:
      targets:
        MatindWorkboard: all
        MatindWorkboardTests: [test]
    run:
      config: Remote
    test:
      config: Remote
      targets:
        - MatindWorkboardTests
